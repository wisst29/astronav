name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Flet
        run: |
          pip install --upgrade pip
          pip install flet setuptools wheel

      - name: Corriger le verrou de securite Git
        run: git config --global --add safe.directory "*"

      - name: Generer l'APK Android (Mode Automatique Force)
        run: |
          flet build apk --no-rich-output --yes

      - name: Sauvegarder le fichier APK final
        uses: actions/upload-artifact@v4
        with:
          name: Application-AstroNav
          path: build/apk/*.apk
